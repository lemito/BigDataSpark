services:
    postgres:
        container_name: spark_db
        image: postgres:18.3-alpine
        environment:
          POSTGRES_DB: spark_db
          POSTGRES_USER: meow
          POSTGRES_PASSWORD: UwU
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
          - ./source_data:/docker-entrypoint-initdb.d
        networks:
          - meowork

    clickhouse:
      image: clickhouse/clickhouse-server:latest
      ports:
        - "8123:8123"
        - "9000:9000"
        - "9009:9009"
      volumes:
        - clickhouse_data:/var/lib/clickhouse
        - ./clickhouse/init-scripts:/docker-entrypoint-initdb.d
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      environment:
        - CLICKHOUSE_USER=meow
        - CLICKHOUSE_PASSWORD=UwU
      networks:
        - meowork

    spark-master:
      image: apache/spark:latest
      container_name: spark-master
      entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
      environment:
        - SPARK_MASTER_HOST=spark-master
        - SPARK_MASTER_PORT=7077
        - SPARK_MASTER_WEBUI_PORT=8080
      ports:
        - "7077:7077"
        - "8080:8080"
      volumes:
        - ./spark_jobs:/scripts
        - ./jars:/jars
      networks:
        - meowork

    spark-worker:
      image: apache/spark:latest
      container_name: spark-worker
      entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
      depends_on:
        - spark-master
      environment:
        - SPARK_WORKER_MEMORY=1g
        - SPARK_WORKER_CORES=1
      volumes:
        - ./spark_jobs:/scripts
        - ./jars:/jars
      networks:
        - meowork

networks:
    meowork:
        driver: bridge

volumes:
    postgres_data:
    clickhouse_data:
